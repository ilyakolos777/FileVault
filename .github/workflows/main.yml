name: Full Application CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-client:
    name: Client (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v4
    
    - name: Настройка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'
        
    - name: Установка системных зависимостей (Xvfb и OpenGL)
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libegl1 libgl1 libglib2.0-0
        
    - name: Установка Python-библиотек
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-qt pytest-mock
        
    - name: Запуск тестов клиента
      env:
        QT_QPA_PLATFORM: xcb
      run: xvfb-run -a python -m pytest tests/ --cov=network --cov=ui --cov=utils

  test-server:
    name: Server (C#)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server/StorageServer
    steps:
    - uses: actions/checkout@v4
    
    - name: Настройка .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Восстановление и сборка
      run: |
        dotnet restore
        dotnet build --no-restore --configuration Release
        
    - name: Запуск тестов сервера
      run: dotnet test --no-build --configuration Release --verbosity normal
